      <circle cx="1092" cy="62" r="2.2"/>
      <circle cx="1128" cy="168" r="2.8"/>
      <circle cx="872" cy="198" r="2.2"/>
      <circle cx="1052" cy="206" r="2.5"/>
    </g>
