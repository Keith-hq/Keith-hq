<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none" role="img" aria-label="Keith-hq — undergraduate in software engineering at Tongji University, engineering-oriented AI researcher and full-stack developer">
