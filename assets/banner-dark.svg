    <circle cx="962" cy="130" r="15" fill="#0b1120" stroke="url(#acc)" stroke-width="2"/>
    <circle cx="962" cy="130" r="5" fill="#22d3ee"/>
    <g fill="#0b1120" stroke="#38bdf8" stroke-width="1.6">
      <circle cx="826" cy="74" r="7"/>
      <circle cx="1092" cy="62" r="6"/>
      <circle cx="1128" cy="168" r="8"/>
      <circle cx="872" cy="198" r="6"/>
      <circle cx="1052" cy="206" r="7"/>
