    <text x="384" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="22" font-weight="600" fill="#f8fafc" letter-spacing="2">软件工程</text>
