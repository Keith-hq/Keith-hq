  <g>
    <rect x="66" y="100" width="196" height="60" rx="30" fill="url(#pill)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="164" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="22" font-weight="600" fill="#f8fafc" letter-spacing="2">同济大学</text>
    <text x="164" y="146" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#7dd3fc" letter-spacing="1.4">TONGJI UNIVERSITY</text>
